name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Drives the shipped binary through a real LSP handshake. A failure here
      # means the thing an editor actually launches is broken, which the unit
      # tests cannot tell you.
      - name: Language server end to end
        run: |
          cargo build --release -p liar-lsp
          python scripts/lsp-smoke.py ./target/release/liar-lsp

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        working-directory: editors/vscode
        run: npm ci
      - name: Typecheck
        working-directory: editors/vscode
        run: npm run check

      # Builds the .vsix a user would install. It must contain the bundled
      # extension and nothing that needs node_modules to load.
      - name: Package
        working-directory: editors/vscode
        run: npm run package

      # Runs the packaged extension inside a real VS Code against the real
      # server: activation, findings, the quick fix, the tone, and a save.
      - name: End to end in VS Code
        run: |
          cargo build --release -p liar-lsp
          cd editors/vscode
          xvfb-run -a npm test

      - uses: actions/upload-artifact@v4
        with:
          name: liar-vsix
          path: editors/vscode/*.vsix
