name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Drives the shipped binary through a real LSP handshake. A failure here
      # means the thing an editor actually launches is broken, which the unit
      # tests cannot tell you.
      - name: Language server end to end
        run: |
          cargo build --release -p liar-lsp
          python scripts/lsp-smoke.py ./target/release/liar-lsp
